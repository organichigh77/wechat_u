<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat Liberator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>微信文章导出</h1>
        <div class="actions">
            <button id="copy-btn" class="btn primary">复制 Markdown</button>
            <button id="download-btn" class="btn secondary">下载 .md 文件</button>
            <button id="html-btn" class="btn secondary">下载 HTML 快照</button>
            <button id="zip-btn" class="btn secondary">下载 ZIP(MD + 图片)</button>
        </div>
        <div id="status" class="status"></div>
    </div>
    <script type="module" src="popup.js"></script>
</body>

</html>
